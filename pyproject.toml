[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "pwa", "data"]
# Provided verbatim per build plan §0.1 — never reformat.
extend-exclude = ["backend/sentinel/risk_engine.py", "backend/tests/test_risk_engine.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "UP038", "SIM105"]

[tool.ruff.lint.per-file-ignores]
# Compact two-call setup lines read better than four in test arrangement blocks.
"backend/tests/**" = ["E702"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-q"
