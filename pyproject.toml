[project]
name = "sentinel"
version = "1.0.0"
description = "AI-assisted human-in-the-loop day-trading console for Indian index options"
readme = "docs/END_TO_END.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "SQLAlchemy==2.0.36",
    "APScheduler==3.11.0",
    "PyYAML==6.0.2",
    "python-dotenv==1.0.1",
    "httpx==0.28.1",
    "growwapi==1.5.0",
    "pandas==2.2.3",
    "pyotp==2.9.0",
    "pywebpush==2.0.3",
    "py-vapid==1.9.2",
    "jsonschema==4.23.0",
    "python-json-logger==3.2.1",
    "boto3==1.35.92",
    "cryptography<44",
    "kiteconnect>=5.0.0",
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "ruff==0.8.6",
    "freezegun==1.5.1",
    "respx==0.22.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "pwa", "data"]
# Provided verbatim per build plan §0.1 — never reformat.
extend-exclude = ["backend/sentinel/risk_engine.py", "backend/tests/test_risk_engine.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "UP038", "SIM105"]

[tool.ruff.lint.per-file-ignores]
# Compact two-call setup lines read better than four in test arrangement blocks.
"backend/tests/**" = ["E702"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-q"
